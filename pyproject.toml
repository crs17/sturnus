[project]
name = "sturnus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jupyterlab>=4.5.6",
    "llama-index>=0.14.23",
    "llama-index-llms-ollama>=0.10.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "tensorflow>=2.21.0",
    "tiktoken>=0.12.0",
    "torch>=2.11.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sturnus"]
